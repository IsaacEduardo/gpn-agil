# WebSocket do Reverb atras do HTTPS existente (wss://ondaka-gph.ao/app/...).
# Incluir DENTRO dos dois blocos `server { listen 443 ... }` de /etc/nginx/sites-available/gpn-agil,
# antes do `location /`:
#     include /var/www/gpn-agil/deploy/nginx/gpn-reverb.conf;
#
# So /app/ (ligacoes dos browsers). A API HTTP do Reverb (/apps/) nao e exposta: o
# Laravel publica os eventos direto em 127.0.0.1:8080 (REVERB_HOST=127.0.0.1).
# Nenhuma rota da aplicacao comeca por /app/.
location ^~ /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # O Reverb faz ping a cada 60 s (REVERB_APP_PING_INTERVAL); acima disso.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
