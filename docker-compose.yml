services:
  mysql:
    image: mysql:8.0
    container_name: gpn_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gpn_agil}
      MYSQL_USER: ${DB_USERNAME:-gpn_agil}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env antes de subir os containers}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env antes de subir os containers}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

  redis:
    image: redis:7-alpine
    container_name: gpn_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  php:
    build:
      context: ./docker/php
    container_name: gpn_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis

  queue:
    build:
      context: ./docker/php
    container_name: gpn_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: ./docker/php
    container_name: gpn_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis

  # Servidor WebSocket para edição colaborativa em tempo real (Laravel Reverb).
  # Processo long-running; só é usado quando FEATURE_COLLAB=true e BROADCAST_CONNECTION=reverb.
  reverb:
    build:
      context: ./docker/php
    container_name: gpn_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8081:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: gpn_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - reverb

volumes:
  mysql-data:
  redis-data: